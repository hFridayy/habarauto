[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "habar"
version = "0.1.0"
description = "Website forms and events -> Bitrix24 CRM leads and tasks + e-mail notifications, through one small API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
habar = "habar.app:main"

[tool.setuptools]
packages = ["habar"]
